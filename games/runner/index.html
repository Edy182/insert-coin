<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DinoClawd 🕹️ — Clawd Bytes</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
</head>
<body>

  <div class="game-shell">

    <header class="game-header">
      <a href="../../" class="back-link">← Clawd Bytes</a>
      <h1>DINOCLAWD</h1>
      <div class="score-box">
        HI <span id="high-score">00000</span>&nbsp;&nbsp;<span id="score">00000</span>
      </div>
    </header>

    <canvas id="game" width="800" height="300"></canvas>

    <div class="controls">
      <p>SPACE / ↑ / TAP to jump &nbsp;·&nbsp; ↓ / SWIPE DOWN to duck</p>
      <button id="restart" class="hidden">RESTART</button>
      <button id="share" class="hidden">📋 COPY SHARE</button>
      <button id="mute">🔊 SOUND</button>
    </div>

    <footer class="game-footer">
      <p>Independent fan project. Not affiliated with Anthropic.</p>
    </footer>

  </div>

  <script src="../../assets/clawd-stats.js?v=4"></script>
  <script src="game.js?v=25"></script>
</body>
</html>
