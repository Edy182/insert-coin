<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clawd Tetris 🦀 — Clawd Bytes</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
</head>
<body>

  <div class="game-shell">

    <header class="game-header">
      <a href="../../" class="back-link">← Clawd Bytes</a>
      <h1>CLAWD TETRIS</h1>
      <div class="score-box">
        HI <span id="high-score">00000</span>&nbsp;&nbsp;<span id="score">00000</span>
      </div>
    </header>

    <canvas id="game" width="464" height="512"></canvas>

    <div class="controls">
      <p>← → move &nbsp;·&nbsp; ↑ rotate &nbsp;·&nbsp; ↓ soft drop &nbsp;·&nbsp; SPACE hard drop</p>
      <button id="restart" class="hidden">RESTART</button>
      <button id="mute">🔊 SOUND</button>
    </div>

    <footer class="game-footer">
      <p>Independent fan project. Not affiliated with or endorsed by Anthropic or Tetris Holding LLC.</p>
    </footer>

  </div>

  <script src="game.js?v=1"></script>
</body>
</html>
