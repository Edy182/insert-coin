<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Clawd Bytes — retro browser games starring the Claude Code mascot. Independent fan project.">
  <title>Clawd Bytes 🕹️</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #FF8A1F;
      --navy: #0B1426;
      --cream: #F5EFE0;
      --green: #3FCB7A;
      --red: #E5564B;
      --gray: #7E8C99;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--navy);
      color: var(--cream);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1.75rem 1rem 1.25rem;
      text-align: center;
      border-bottom: 2px solid var(--orange);
    }
    h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(1.1rem, 4vw, 2rem);
      color: var(--orange);
      letter-spacing: 0.05em;
      margin-bottom: 0.6rem;
    }
    .tagline {
      font-family: 'VT323', monospace;
      font-size: 1.1rem;
      color: var(--gray);
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      width: 100%;
    }
    .games-grid {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
    }
    .game-card {
      background: rgba(255, 138, 31, 0.08);
      border: 2px solid var(--orange);
      border-radius: 6px;
      padding: 1.25rem 1rem;
      text-align: center;
      transition: transform 0.15s ease, background 0.15s ease;
      position: relative;
    }
    .game-card.available { cursor: pointer; }
    .game-card.available:hover {
      transform: translateY(-3px);
      background: rgba(255, 138, 31, 0.18);
    }
    .game-card.coming-soon {
      border-color: var(--gray);
      opacity: 0.5;
      cursor: not-allowed;
    }
    .game-card .sprite {
      width: 56px; height: 56px;
      margin: 0 auto 0.75rem;
      background: var(--orange);
      border-radius: 4px;
      image-rendering: pixelated;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .game-card .sprite svg {
      width: 72%;
      height: 72%;
      shape-rendering: crispEdges;
    }
    .game-card.coming-soon .sprite { background: var(--gray); }
    .game-card.coming-soon .sprite svg { opacity: 0.75; }
    .game-card h2 {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.68rem;
      color: var(--cream);
      margin-bottom: 0.75rem;
    }
    .game-card .play-btn {
      display: inline-block;
      padding: 0.45rem 0.9rem;
      background: var(--orange);
      color: var(--navy);
      font-family: 'Press Start 2P', monospace;
      font-size: 0.6rem;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
    }
    .game-card.coming-soon .play-btn {
      background: var(--gray);
      color: var(--navy);
      pointer-events: none;
    }
    footer {
      padding: 2rem;
      text-align: center;
      border-top: 1px solid var(--gray);
      font-size: 0.85rem;
      color: var(--gray);
    }
    footer a {
      color: var(--orange);
      text-decoration: none;
      margin: 0 0.5rem;
    }
    .disclaimer {
      max-width: 600px;
      margin: 0 auto 1rem;
      font-size: 0.75rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <header>
    <h1>CLAWD BYTES</h1>
    <p class="tagline">retro games for the AI dev community</p>
  </header>

  <main>
    <div class="games-grid">

      <a href="games/runner/" class="game-card available">
        <div class="sprite">
          <svg viewBox="0 0 12 9" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
            <g fill="#F5EFE0">
              <rect x="1" y="0" width="10" height="4"/>
              <rect x="0" y="4" width="12" height="2"/>
              <rect x="1" y="6" width="10" height="2"/>
              <rect x="2" y="8" width="1" height="1"/>
              <rect x="4" y="8" width="1" height="1"/>
              <rect x="8" y="8" width="1" height="1"/>
              <rect x="10" y="8" width="1" height="1"/>
            </g>
            <g fill="#1A0808">
              <rect x="3" y="2" width="1" height="2"/>
              <rect x="9" y="2" width="1" height="2"/>
            </g>
          </svg>
        </div>
        <h2>CLAWD RUNNER</h2>
        <span class="play-btn">▶ PLAY</span>
      </a>

      <a href="games/chomp/" class="game-card available">
        <div class="sprite">
          <svg viewBox="0 0 12 12" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
            <circle cx="6" cy="6" fill="#F5EFE0">
              <animate attributeName="r" values="2.6;4.4;2.6" dur="0.9s" repeatCount="indefinite"/>
            </circle>
          </svg>
        </div>
        <h2>CLAWDMAN</h2>
        <span class="play-btn">▶ PLAY</span>
      </a>

      <a href="games/snake/" class="game-card available">
        <div class="sprite">
          <svg viewBox="0 0 12 12" xmlns="http://www.w3.org/2000/svg">
            <g fill="#F5EFE0">
              <circle cx="1.5"  cy="6" r="1.4"/>
              <circle cx="4"    cy="6" r="1.7"/>
              <circle cx="6.8"  cy="6" r="2"/>
              <circle cx="9.8"  cy="6" r="2.3"/>
            </g>
            <circle cx="10.4" cy="5" r="0.45" fill="#1A0808"/>
          </svg>
        </div>
        <h2>CLAWD SNAKE</h2>
        <span class="play-btn">▶ PLAY</span>
      </a>

      <a href="games/tetris/" class="game-card available">
        <div class="sprite">
          <svg viewBox="0 0 12 12" xmlns="http://www.w3.org/2000/svg">
            <g fill="#F5EFE0">
              <rect x="4" y="2" width="2" height="8"/>
              <rect x="6" y="8" width="2" height="2"/>
            </g>
          </svg>
        </div>
        <h2>CLAWD TETRIS</h2>
        <span class="play-btn">▶ PLAY</span>
      </a>

    </div>
  </main>

  <footer>
    <p class="disclaimer">
      Clawd Bytes is an independent fan project.<br>
      Not affiliated with or endorsed by Anthropic.
    </p>
    <p>
      <a href="https://github.com/[your-handle]/clawd-bytes">GitHub</a> ·
      <a href="https://discord.gg/[your-invite]">Discord</a> ·
      <a href="https://twitter.com/clawdbytes">@clawdbytes</a>
    </p>
  </footer>

</body>
</html>
